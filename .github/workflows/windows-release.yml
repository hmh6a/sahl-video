name: Build Windows and macOS release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Check native build architecture
        run: node -e "if(process.platform !== '${{ matrix.platform }}' || process.arch !== '${{ matrix.arch }}') process.exit(1)"
      - name: Set release version from the pushed tag
        run: node scripts/set-build-version.cjs
      - name: Install locked dependencies including bundled video tools
        run: npm ci
      - name: Test editing, recovery and real video export
        run: npm test
      - name: Test Electron media seeking
        run: npx electron tests/electron-protocol.cjs
      - name: Prepare native speech engine
        run: npm run prepare:transcription
      - name: Provision checked speech model for offline verification
        run: node scripts/provision-speech-model.cjs
      - name: Verify native silence and noise handling
        run: npm run verify:speech
      - name: Test captions in Electron
        run: npx electron tests/electron-captions.cjs
      - name: Test editor workflow in Electron
        run: npx electron tests/electron-workflow.cjs
      - name: Build Windows installer or Mac DMG and update ZIP
        run: npm run dist:release
        env:
          CSC_LINK: ${{ matrix.platform == 'darwin' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'darwin' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'darwin' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'darwin' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'darwin' && secrets.APPLE_TEAM_ID || '' }}
      - name: Verify packaged tools work without system FFmpeg and prepare release
        run: node scripts/prepare-release.cjs
        env:
          SAHL_SPEECH_MODEL: test-output/transcription/ggml-small.bin
      - name: Keep tested artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sahl-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish all tested desktop builds
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Install manifest validation tools
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sahl-*
          path: release-input/
      - name: Verify all artifacts, merge architecture metadata and publish
        run: node scripts/publish-release.cjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
